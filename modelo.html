<script>
{
const D=/*DADOS*/[];
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F={tp:['Jornal junino','Folheto de divulgação','Folheto de programação','Convite de evento','Jornal regular'],
dec:['1960','1970','1980','1990','Ano de 2000'],
re:['Grupo ou particular','Poder público','Igreja','Igreja e poder público','Não consta'],
rec:['Letreiramento manual','Datilografia','Tipos ou fontes digitais','Ilustração à mão','Ilustração digital','Fotografia','Marca']};
const ORD=(k,b)=>{const v=new Set(D.flatMap(o=>k==='rec'?o.rec:[o[k]]));const r=b.filter(x=>v.has(x));v.forEach(x=>{if(!r.includes(x))r.push(x)});return k==='dec'?r.sort((a,b)=>parseInt(a.replace(/\D/g,''))-parseInt(b.replace(/\D/g,''))):r};
for(const k in F)F[k]=ORD(k,F[k]);
const NAMES={tp:'Tipo',dec:'Década',re:'Realização ou apoio',rec:'Recursos gráficos'};
const st={q:'',open:null,tp:new Set(),dec:new Set(),re:new Set(),rec:new Set()};
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const match=(o,skip)=>{
 if(st.q){const h=norm([o.t,o.au,o.im,o.n,o.y].join(' '));if(!norm(st.q).split(/\s+/).every(w=>h.includes(w)))return false}
 for(const k of ['tp','dec','re'])if(k!==skip&&st[k].size&&!st[k].has(o[k]))return false;
 if(skip!=='rec')for(const r of st.rec)if(!o.rec.includes(r))return false;
 return true};
const has=(o,k,v)=>k==='rec'?o.rec.includes(v):o[k]===v;
const wrap=h=>`<div class="wrap">${h}</div>`;
function act(){return Object.keys(F).reduce((n,k)=>n+st[k].size,0)}
function bar(){
 const n=act();
 document.getElementById('fbar').innerHTML=wrap(`<div class="frow"><button class="fbtn" type="button" id="fbtn" aria-haspopup="dialog">Filtros${n?`<b>${n}</b>`:''}</button><span class="sp"></span><label class="search"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5" stroke-linecap="round"/></svg><input type="search" id="q" aria-label="Buscar" value="${esc(st.q)}" placeholder="Buscar por título ou nome"></label></div>`);
 document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value;grid()});
 document.getElementById('fbtn').addEventListener('click',openPanel);
}
function panelBody(){
 const total=D.filter(o=>match(o)).length;
 document.getElementById('pb').innerHTML=Object.keys(F).map(k=>`<div class="fg" role="group" aria-labelledby="g-${k}"><h3 class="fgt" id="g-${k}">${NAMES[k]}</h3><div class="chips">${F[k].map(v=>{const n=D.filter(o=>match(o,k)&&has(o,k,v)).length;const on=st[k].has(v);return `<button class="chip" type="button" data-k="${k}" data-v="${esc(v)}" aria-pressed="${on}" ${!n&&!on?'disabled':''}>${esc(v)}<span>${n}</span></button>`}).join('')}</div></div>`).join('');
 document.getElementById('pgo').textContent=total?`Ver ${total} ${total===1?'impresso':'impressos'}`:'Nenhum impresso';
 document.getElementById('pclr').disabled=!act();
 document.querySelectorAll('#pb .chip').forEach(b=>b.addEventListener('click',()=>{const s=st[b.dataset.k],v=b.dataset.v;s.has(v)?s.delete(v):s.add(v);panelBody();grid();bar();document.querySelector(`#pb .chip[data-k="${b.dataset.k}"][data-v="${CSS.escape(v)}"]`)?.focus()}));
}
function openPanel(){
 document.body.insertAdjacentHTML('beforeend',`<div class="veil" id="veil"></div><div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pt"><div class="ph-h"><h2 id="pt">Filtros</h2><button class="xbtn" type="button" id="px" aria-label="Fechar">×</button></div><div class="pb" id="pb"></div><div class="pf"><button class="clr" type="button" id="pclr">Limpar</button><button class="btn" type="button" id="pgo"></button></div></div>`);
 document.body.style.overflow='hidden';
 panelBody();
 const close=()=>{document.getElementById('panel')?.remove();document.getElementById('veil')?.remove();document.body.style.overflow='';document.removeEventListener('keydown',esc_);document.getElementById('fbtn')?.focus()};
 const esc_=e=>{if(e.key==='Escape')close()};
 document.addEventListener('keydown',esc_);
 document.getElementById('px').onclick=close;document.getElementById('veil').onclick=close;document.getElementById('pgo').onclick=close;
 document.getElementById('pclr').onclick=()=>{for(const k in F)st[k].clear();panelBody();grid();bar()};
 document.getElementById('px').focus();
}
function grid(){
 const L=D.filter(o=>match(o));
 document.getElementById('count').textContent=L.length===D.length?'':`${L.length} de ${D.length} impressos`;
 document.getElementById('grid').innerHTML=L.length?L.map(o=>`<a class="card" href="#item-${o.id}"><div class="box"><div class="img${rat(o)>1?' ls':''}" style="--r:${rat(o)}">${thumb(o,'loading="lazy" decoding="async"')}</div></div><div class="cap"><span><b>${esc(o.t)}</b>${o.n?', n.º '+esc(o.n):''}<small class="num">${o.y}</small></span></div></a>`).join(''):'<p class="empty">Nenhum impresso corresponde à busca e aos filtros.</p>';
}
const thumb=(o,x)=>`<img src="img/${o.c[0]}-t.webp" srcset="img/${o.c[0]}-t.webp 480w, img/${o.c[0]}-t2.webp 960w" sizes="(max-width:760px) 50vw, 240px" alt="" ${x}>`;

const hsh=t=>[...t].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);

function hero(){
 const h=document.getElementById('hero');if(!h)return;
 h.querySelectorAll('.pc').forEach(e=>e.remove());
 const W=h.clientWidth,H=h.clientHeight,sc=Math.max(.5,Math.min(1.1,W/1360)),mob=W<760;let z=10;
 PICK.forEach((o,k)=>{const [x,y,r,w]=POS[k],cw=w*sc,ch=cw/rat(o);
  const a=document.createElement('a');a.className='pc';a.href='#item-'+o.id;a.title=a.ariaLabel=`${o.t}, ${o.y}`;
  a.innerHTML=`<div class="img">${thumb(o,'draggable="false" fetchpriority="high"')}</div>`;a.style.width=cw+'px';a.style.height=ch+'px';a.style.zIndex=z++;
  let px=x/100*W-cw/2,py=y/100*H-ch/2;const put=()=>a.style.transform=`translate(${px}px,${py}px) rotate(${r}deg)`;put();
  if(!mob){let sx,sy,ox,oy,mv=false;
   a.addEventListener('pointerdown',ev=>{if(ev.button)return;sx=ev.clientX;sy=ev.clientY;ox=px;oy=py;mv=false;a.setPointerCapture(ev.pointerId);a.style.zIndex=++z;
    const m=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(!mv&&Math.hypot(dx,dy)>5){mv=true;a.classList.add('drag')}if(mv){px=Math.max(-cw/2,Math.min(W-cw/2,ox+dx));py=Math.max(-ch/2,Math.min(H-ch/2,oy+dy));put()}};
    const u=()=>{a.removeEventListener('pointermove',m);a.removeEventListener('pointerup',u);a.classList.remove('drag')};
    a.addEventListener('pointermove',m);a.addEventListener('pointerup',u)});
   a.addEventListener('click',ev=>{if(mv){ev.preventDefault();mv=false}});
   a.addEventListener('dragstart',ev=>ev.preventDefault())}
  h.appendChild(a)})}

 <details class="cit"><summary>Citar este item</summary><p>${esc(o.t)}${o.n?', n.º '+esc(o.n):''}, ${esc(o.d)}. Item ${esc(o.code)}. In: Fagulha. Disponível em: {{SITE_URL}}#item-${esc(o.id)}. Acesso em: ${hoje()}.</p></details></div>
 </aside></div>`);
 const stage=document.getElementById('stage'),pos=document.getElementById('vpos'),th=document.getElementById('thumbs');
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const pg=i=>`<div class="pg"><img src="img/${o.g[i][0]}.webp" alt="${esc(o.t)}, ${un.toLowerCase()} ${i+1} de ${n}"></div>`;
 stage.style.aspectRatio=R;document.querySelector('.stagewrap').style.width=`min(100%, calc(74vh * ${R}))`;
 let cur=0,busy=false;
 th.innerHTML=Array.from({length:n},(_,i)=>`<button class="th" type="button" data-i="${i}" aria-label="${un} ${i+1}">${i+1}</button>`).join('');
 const sync=()=>{const oa=document.querySelector('.orig');oa.href=`img/${o.g[cur][0]}.webp`;pos.textContent=faces&&n===2?(cur?'Verso':'Frente'):`${cur+1} / ${n}`;document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===n-1;th.querySelectorAll('.th').forEach((b,i)=>b.setAttribute('aria-current',i===cur))};
 if(faces&&n===2){
  stage.innerHTML=`<div class="flip" id="flip"><div class="face front">${pg(0)}</div><div class="face back">${pg(1)}</div></div>`;
  const flip=document.getElementById('flip');
  const go=i=>{if(i<0||i>1)return;cur=i;flip.classList.toggle('on',cur===1);sync()};
  document.getElementById('prev').onclick=()=>go(0);document.getElementById('next').onclick=()=>go(1);
  stage.onclick=()=>go(cur?0:1);th.querySelectorAll('.th').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  window.onkeydown=e=>{if(!document.getElementById('flip'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(0)};
 }else{
  stage.innerHTML=`<div class="leaf base">${pg(0)}</div>`;
  const go=i=>{
   if(busy||i<0||i>=n||i===cur)return;
   const fwd=i>cur;
   if(reduce){stage.innerHTML=`<div class="leaf base">${pg(i)}</div>`;cur=i;sync();return}
   busy=true;
   if(fwd){stage.innerHTML=`<div class="leaf base">${pg(i)}</div><div class="leaf turn">${pg(cur)}</div>`;
    const t=stage.querySelector('.turn');requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('out')));
   }else{stage.innerHTML=`<div class="leaf base">${pg(cur)}</div><div class="leaf turn out">${pg(i)}</div>`;
    const t=stage.querySelector('.turn');requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.remove('out')));}
   cur=i;sync();
   setTimeout(()=>{stage.innerHTML=`<div class="leaf base">${pg(cur)}</div>`;busy=false},620)};
  document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
  th.querySelectorAll('.th').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  window.onkeydown=e=>{if(!document.getElementById('stage'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)};
  let x0=null;stage.onpointerdown=e=>{x0=e.clientX};stage.onpointerup=e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1));else if(e.clientX>stage.getBoundingClientRect().left+stage.clientWidth/2)go(cur+1);else go(cur-1)};
 }
 sync()}

 const S=['A festa e seus impressos','A pesquisa','Limites do acervo','Como citar','Créditos'];
 app.innerHTML=wrap(`<div class="page"><h1>Sobre</h1>`+S.map((t,k)=>`<section class="sb"><h2>${t}</h2><div>${'<div class="ph"></div><div class="ph"></div><div class="ph s"></div>'.repeat(k?1:3)}</div></section>`).join('')+'</div>')}
function contribuir(){
 app.innerHTML=wrap(`<div class="page cpage"><h1>Contribuir</h1><p class="lead">Texto explicando como enviar materiais, corrigir informações ou pedir a retirada de itens (a escrever)</p>
 <form id="fm"><label>Nome<input name="n" autocomplete="name"></label><label>E-mail<input name="e" type="email" autocomplete="email"></label>
 <label>Assunto<select name="a"><option>Enviar contribuição</option><option>Solicitar retirada de item</option><option>Corrigir informação</option></select></label>
 <label>Mensagem<textarea name="m"></textarea></label><button class="btn" type="submit">Enviar</button><p class="note" id="fmsg">Formulário ilustrativo: o envio será definido na implementação.</p></form></div>`);
 document.getElementById('fm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('fmsg').textContent='Envio ainda não implementado nesta versão.'})}
let savedY=null,fromHome=false;
document.addEventListener('click',e=>{if(e.target.closest('a[href^="#item-"]')&&!location.hash.startsWith('#item-')){savedY=scrollY;fromHome=true}},true);
function goBack(){if(fromHome)history.back();else location.hash='#inicio'}
function route(){
 let h=(location.hash||'#inicio').slice(1);
 if(h==='contexto')h='sobre';if(h==='contribuicoes')h='contribuir';
 const r=h.startsWith('item-')?'inicio':h;
 document.querySelectorAll('header nav a').forEach(a=>{if(a.dataset.r===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 if(h.startsWith('item-'))item(h.slice(5));else if(h==='sobre')sobre();else if(h==='contribuir')contribuir();else inicio();
 if(h==='inicio'&&fromHome&&savedY!==null)window.scrollTo(0,savedY);else window.scrollTo(0,0);
 if(!h.startsWith('item-'))fromHome=false}
window.addEventListener('hashchange',route);route();
}
